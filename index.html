<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Arragon 的网页作品导航">
  <title>Arragon · Web Archive</title>
  <style>
    :root { --ink:#24231f; --muted:#77736a; --paper:#fdfbf7; --line:#e8e2d6; --accent:#a24e32; --olive:#65704d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 80% 0%,#f2e8d7 0,transparent 27rem),var(--paper); font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(1120px,calc(100% - 40px)); margin:auto; padding:72px 0 80px; }
    header { max-width:720px; margin-bottom:56px; }
    .eyebrow { margin:0 0 16px; color:var(--accent); font:700 .78rem/1.2 ui-sans-serif,system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font:500 clamp(2.8rem,8vw,6.2rem)/.95 Georgia,"Noto Serif SC","Songti SC",serif; letter-spacing:-.055em; }
    .lead { max-width:610px; margin:24px 0 0; color:#575349; font-size:1.08rem; }
    .rule { height:1px; margin:0 0 24px; background:var(--line); }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }
    h2 { margin:0; font:600 1rem/1.3 ui-sans-serif,system-ui,sans-serif; letter-spacing:.02em; }
    #count { color:var(--muted); font-size:.9rem; text-align:right; }
    #pages { display:grid; gap:38px; }
    .group-title { margin:0 0 14px; font:600 1rem/1.3 ui-sans-serif,system-ui,sans-serif; letter-spacing:.02em; }
    .group { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    .group-title { grid-column:1/-1; }
    .card { display:flex; flex-direction:column; min-height:180px; padding:23px; color:inherit; text-decoration:none; background:rgba(255,255,255,.56); border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 20px rgba(74,55,27,.035); transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease; }
    .card:hover { transform:translateY(-3px); border-color:#cbb8a0; box-shadow:0 12px 28px rgba(74,55,27,.10); }
    .number { color:var(--olive); font:600 .78rem/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.08em; }
    .title { margin:auto 0 8px; font:500 1.28rem/1.28 Georgia,"Noto Serif SC","Songti SC",serif; overflow-wrap:anywhere; }
    .path { color:var(--muted); font-size:.78rem; overflow-wrap:anywhere; }
    .empty,.error { grid-column:1/-1; padding:30px; color:var(--muted); border:1px dashed var(--line); border-radius:12px; text-align:center; }
    footer { margin-top:54px; color:var(--muted); font-size:.88rem; }
    code { padding:.12em .35em; background:#f0ece3; border-radius:4px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    @media (max-width:600px) { main { width:min(100% - 30px,1120px); padding-top:48px; } header { margin-bottom:40px; } .toolbar { align-items:flex-start; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Arragon / web archive</p>
      <h1>把想法，<br>做成可抵达的网页。</h1>
      <p class="lead">这里收录互动网页、企划与知识地图。HTML 文件放进 <code>pages/</code> 的主题目录后会自动出现在导航中；导航只展示已经由 GitHub Pages 实际发布、可以正常打开的页面。</p>
    </header>
    <div class="rule"></div>
    <section aria-labelledby="pages-heading">
      <div class="toolbar"><h2 id="pages-heading">全部页面</h2><span id="count" aria-live="polite">正在读取目录…</span></div>
      <div id="pages"><p class="empty">正在载入页面列表…</p></div>
    </section>
    <footer>Arragon · Hosted with GitHub Pages</footer>
  </main>
  <script>
    const owner = 'Arragon';
    const repository = 'my-websites';
    const branch = 'main';
    const directory = 'pages';

    const groupLabels = {
      projects: '项目企划',
      'projects/RTS-game-design': 'RTS · 游戏设计与生产管线',
      'knowledge/literature': '知识地图 · 文学与美学',
      'knowledge/philosophy': '知识地图 · 哲学与思想',
    };

    const container = document.querySelector('#pages');
    const count = document.querySelector('#count');

    const titleFrom = (filename) => decodeURIComponent(filename)
      .replace(/\.html?$/i, '')
      .replace(/[_-]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    const hrefFor = (path) => `./${path.split('/').map(segment => encodeURIComponent(segment)).join('/')}`;

    async function isPublished(href) {
      try {
        const response = await fetch(href, { method: 'HEAD', cache: 'no-store' });
        return response.ok;
      } catch {
        return false;
      }
    }

    async function loadPages() {
      try {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repository}/git/trees/${branch}?recursive=1`,
          { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' }
        );
        if (!response.ok) throw new Error(`GitHub API ${response.status}`);

        const sourceFiles = (await response.json()).tree
          .filter(item => item.type === 'blob' && item.path.startsWith(`${directory}/`) && /\.html?$/i.test(item.path))
          .sort((a, b) => a.path.localeCompare(b.path, 'zh-CN'));

        // GitHub source branch updates before GitHub Pages finishes deploying. Verify the
        // same-origin Pages URL first so newly pushed files never appear as temporary 404 links.
        const checked = await Promise.all(sourceFiles.map(async file => {
          const href = hrefFor(file.path);
          return (await isPublished(href)) ? { ...file, href } : null;
        }));
        const files = checked.filter(Boolean);
        const pending = sourceFiles.length - files.length;

        count.textContent = `${files.length} 个页面${pending ? ` · ${pending} 个等待 Pages 发布` : ''}`;
        if (!files.length) {
          container.innerHTML = pending
            ? '<p class="empty">页面正在由 GitHub Pages 发布，请稍后刷新。</p>'
            : '<p class="empty">pages/ 目录中还没有已发布的 HTML 文件。</p>';
          return;
        }

        const groups = files.reduce((all, file) => {
          const name = file.path.split('/').slice(1, -1).join('/') || '未分类';
          (all[name] ||= []).push(file);
          return all;
        }, {});

        const orderedGroups = Object.entries(groups)
          .sort(([a], [b]) => (groupLabels[a] || a).localeCompare(groupLabels[b] || b, 'zh-CN'));

        container.replaceChildren(...orderedGroups.map(([groupName, groupFiles]) => {
          const section = document.createElement('section');
          const heading = document.createElement('h3');
          heading.className = 'group-title';
          heading.textContent = groupLabels[groupName] || groupName;

          const grid = document.createElement('div');
          grid.className = 'group';
          grid.append(heading, ...groupFiles.map((file, index) => {
            const link = document.createElement('a');
            const filename = file.path.split('/').at(-1);
            link.className = 'card';
            link.href = file.href;
            link.innerHTML = `<span class="number">${String(index + 1).padStart(2, '0')}</span><span class="title"></span><span class="path"></span>`;
            link.querySelector('.title').textContent = titleFrom(filename);
            link.querySelector('.path').textContent = file.path;
            return link;
          }));
          section.append(grid);
          return section;
        }));
      } catch (error) {
        count.textContent = '无法读取目录';
        container.innerHTML = '<p class="error">导航暂时无法读取或验证 pages/ 目录。请稍后刷新，或直接检查仓库内容。</p>';
        console.error(error);
      }
    }

    loadPages();
  </script>
</body>
</html>
